; PlatformIO Project Configuration File
; ATmega644P AVR Project - Zac Adjei
; https://docs.platformio.org/page/projectconf.html

; Default environment to build when no environment is selected
[platformio]
default_envs = 06_state_machine

; Shared settings inherited by every environment
[common]
platform = atmelavr                 ; AVR platform for Microchip/Atmel chips
board = ATmega644P                  ; ATmega644P DIP-40 chip
framework =                         ; Bare metal - no framework
build_flags =
    -DF_CPU=20000000UL              ; 20 MHz external crystal
    -O0                             ; Disable optimisation to allow variable delays
board_build.f_cpu = 20000000UL     ; Set board CPU frequency to 20 MHz
upload_protocol = stk500v2         ; STK500v2 protocol used by Pololu programmer
upload_port = COM4                  ; Pololu programming port
upload_speed = 115200               ; Communication baud rate
upload_flags =
    -b 115200                       ; Set baud rate explicitly
    -D                              ; Disable auto erase before programming
    -B 10                           ; Slow ISP bit clock to avoid timeout

; --- Project environments ---
; Select the active environment from the VS Code status bar (bottom left)
; or pass -e <name> to pio run / pio run --target upload

[env:01_blink]
extends = common
build_src_filter = -<*> +<01_blink.c>

[env:02_led_cycle]
extends = common
build_src_filter = -<*> +<02_led_cycle.c>

[env:03_button_polling]
extends = common
build_src_filter = -<*> +<03_button_polling.c>

[env:04_interrupt_buzzer]
extends = common
build_src_filter = -<*> +<04_interrupt_buzzer.c>

[env:05_state_machine_basic]
extends = common
build_src_filter = -<*> +<05_state_machine_basic.c>

[env:05_state_machine]
extends = common
build_src_filter = -<*> +<05_state_machine.c>

[env:06_state_machine]
extends = common
build_src_filter = -<*> +<06_state_machine.c>

[env:00_fuse_test]
extends = common
build_src_filter = -<*> +<00_fuse_test.c>
