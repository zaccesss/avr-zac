; PlatformIO Project Configuration File
; ATmega644P AVR Project - Isaac Adjei
; https://docs.platformio.org/page/projectconf.html

; Default environment to build when no environment is selected
[platformio]
default_envs = 01_blink

; Shared settings inherited by every environment
[common]
platform = atmelavr                 ; AVR platform for Microchip/Atmel chips
board = ATmega644P                  ; ATmega644P DIP-40 chip
framework =                         ; Bare metal - no Arduino framework
build_flags =
    -DF_CPU=20000000UL              ; 20 MHz external crystal on this PCB
    -Os                             ; Enable optimization required by util/delay.h
board_build.f_cpu = 20000000UL      ; Inform PlatformIO of the CPU frequency
upload_protocol = stk500v2          ; STK500v2 protocol used by the Pololu programmer
upload_port = COM4                  ; Pololu programming port (lower-numbered COM port)
upload_speed = 57600                ; Slower baud is often more reliable on USB-serial links
upload_flags =
    -b 57600                        ; Match slower baud rate
    -B 40                           ; Slow ISP bit clock further to reduce write timeouts

; --- Active project ---
; Only one source file lives in platformio/src/ at a time.
; To switch to a different project:
;   1. Copy the relevant .c file from projects/learning_projects/<name>/ into platformio/src/
;   2. Rename or update the environment block below to match the new filename.
;   3. Update default_envs at the top if needed.

[env:01_blink]
extends = common
build_src_filter = -<*> +<01_blink.c>
